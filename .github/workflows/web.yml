name: Web app

# Publishes the web version to GitHub Pages so it can be opened in any browser and added to an
# iPhone home screen. Skips quietly until Pages is switched on (Settings > Pages > Source: GitHub Actions).
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository, so the web app was not published."
          fi

      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build
        if: steps.pages.outputs.enabled == 'true'
        env:
          WEB_BASE: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build:web

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        if: steps.pages.outputs.enabled == 'true'
        id: deploy
